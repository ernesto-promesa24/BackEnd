# Configuración opcional para Render (Infrastructure as Code).
# También puedes crear el servicio manualmente desde el panel de Render.
services:
  - type: web
    name: incidencias-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FIREBASE_CREDENTIALS
        sync: false          # Se captura a mano en el panel (secreto)
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: ORIGENES_PERMITIDOS
        sync: false
      - key: API_TOKEN
        sync: false
